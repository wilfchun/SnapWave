[package]
name = "snapwave"
version = "0.1.0"
edition = "2021"
build = false

# plan.md Phase 12: the model is 100% Rust. Cargo no longer compiles the
# Fortran core, the bundled Triangle C code, or links NetCDF/Fortran
# runtimes — the `build.rs` orchestrator and the `cc` build dependency are
# gone (`build = false` keeps the retired `build.rs` stub from being
# auto-detected as a build script). The legacy `make` build remains
# available as the numerical oracle (see `flake.nix` `snapwave-legacy`).

[[bin]]
name = "snapwave"
path = "src_rust/main.rs"

[dependencies]
anyhow = "1"

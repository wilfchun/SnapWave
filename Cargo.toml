[package]
name = "snapwave"
version = "0.1.0"
edition = "2021"
build = "build.rs"

# Rust wrapper around the existing Fortran core. The binary provides `main`,
# calls the Fortran solver through the coarse C ABI facade in
# src/snapwave_c_api.f90 and links against the original Fortran/C objects.

[[bin]]
name = "snapwave"
path = "src_rust/main.rs"

[dependencies]
anyhow = "1"

[build-dependencies]
cc = "1"
